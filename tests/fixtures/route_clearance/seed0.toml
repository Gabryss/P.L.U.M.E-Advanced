# Seed-0 junction-floor regression from the 2026-09-14 acceptance campaign.
schema_version = 4
procedural_seed = 1

[world]
body = "earth"
material = "terrestrial_basalt"

[flow_regime]
supply_rate_scale = 1.0
duration_scale = 1.0
inflation = 0.50
distributary_tendency = 0.65
cooling_rate_scale = 1.0

[host_field]
apply_body_scaling = false

[host_field.routing_weights]
slope = 0.12
cover = 0.10
fracture = 0.22
capacity = 0.28
stability = 0.28
normalize = true
enabled = true

[host_field.grid]
