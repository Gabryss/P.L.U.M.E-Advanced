schema_version = 3
procedural_seed = 1

[world]
# Supported presets: "earth", "mars", "moon".
# Passage/room dimensions and stability inputs follow this selection unless
# they are explicitly overridden below.
body = "earth"
material = "terrestrial_basalt"

[flow_regime]
# Dimensionless procedural controls kept separate from gravity/geology.
supply_rate_scale = 1.0
duration_scale = 1.0
inflation = 0.50
distributary_tendency = 0.65
cooling_rate_scale = 1.0

[run]
# Development mode shortens each body proportionally without shrinking passages.
dev_mode = true
quality = "standard"
dev_max_route_length_m = 1500.0
dev_max_braid_zones = 2
render_diagnostics = true
# Safety default: prompt before writing into a non-empty generation directory.
# Set true only for unattended/debug batches that intentionally replace files.
overwrite_outputs = false

[export]
# Build ready-to-import packages for Blender, UE5, Unity, Gazebo Jetty, and
# NVIDIA Omniverse from the same canonical cave mesh.
target = "all"
format = "auto"
generate_collision = true

[host_field]
# Scale the Earth-authored base ranges using the selected body's host profile.
apply_body_scaling = true

[host_field.routing_weights]
slope = 0.12
cover = 0.10
fracture = 0.22
capacity = 0.28
stability = 0.28
normalize = true
enabled = true

[host_field.grid]
width = 1800.0
height = 6000.0
nx = 220
ny = 560

[host_field.ranges]
seed_point_x = [-160.0, 160.0]
seed_point_y = [-2700.0, -2350.0]
high_side_elevation = [170.0, 205.0]
longitudinal_drop = [68.0, 112.0]
flow_angle_degrees = [84.0, 96.0]
corridor_depth = [8.0, 18.0]
corridor_width = [210.0, 340.0]
volcanic_layer_thickness = [56.0, 78.0]
minimum_stable_cover = [15.0, 24.0]
roof_competence_baseline = [0.64, 0.80]
roof_competence_variation = [0.12, 0.24]
fracture_zone_angle_degrees = [-14.0, 16.0]
fracture_zone_center_offset = [-120.0, 140.0]
fracture_zone_width = [120.0, 260.0]

[host_field.wave_ranges]
count = [3, 5]
amplitude = [3.0, 14.0]
wavelength = [520.0, 1900.0]
angle_degrees = [-65.0, 85.0]
phase = [-3.14159, 3.14159]

[network]
growth_model = "hybrid_lobe"
emplacement_backend = "internal"
# Global loop/lobe density: 0 disables lobe branches, 1 preserves the calibrated
# default, and values up to 3 launch progressively denser anastomosing networks.
network_density = 3.0
# Independent process opportunities; density selects the endmember while
# these controls tune launches, anastomoses, captures, and chamber gain.
lobe_launch_rate = 1.0
loop_probability = 1.0
capture_probability = 1.0
chamber_gain = 1.0
source_count = 8
source_band_length = 90.0
source_band_half_width = 180.0
sink_margin = 80.0
trace_max_steps = 460
max_uphill_step = 1.2
growth_cost_weight = 3.2
corridor_weight = 0.35
chamber_flux_quantile = 0.82
occupancy_smoothing_passes = 2
# Keep parallel centrelines separated by at least this many full passage
# widths; the generator also enforces a host-corridor-relative minimum.
minimum_branch_offset_widths = 1.25
paint_flux_chambers = false
spur_count = 4
spur_max_steps = 24
spur_lateral_bias = 1.3
spur_congestion_weight = 0.85
channel_count_samples = 28

# Process-based Stage-B growth. Active lobes follow a correlated perturbation
# of the host terrain, diverge under local pressure, coalesce into downstream
# channels, or retire when their exposed thermal budget is exhausted.
[network.lobe_growth]
path_count = [8, 12]
maximum_steps = [42, 96]
minimum_persistence_steps = 8
minimum_anchor_spacing_fraction = 0.055
terrain_perturbation_m = 2.4
perturbation_correlation_cells = 3.5
candidate_temperature = 0.38
inertia_weight = 1.35
perturbed_slope_weight = 2.10
downstream_potential_weight = 3.20
initial_divergence_weight = 2.40
channel_avoidance_weight = 1.80
channel_reuse_weight = 3.60
exposed_cooling_multiplier = 5.0
retirement_temperature_k = 1060.0
branch_flux_fraction = [0.18, 0.58]
retired_path_fraction = 0.24
backbone_curvature_fraction = 0.20
backbone_curvature_wavelength_fraction = 0.38
backbone_curvature_secondary_fraction = 0.35

# Seeded emplacement history. Successive lava pulses can abandon older routes,
# establish vertically stacked tubes, recapture lower passages, and preserve
# only selected high-energy coalescences as enlarged chambers.
[network.emplacement_history]
phase_count = [3, 5]
active_phase_span = [1, 3]
stacked_lobe_fraction = 0.34
maximum_absolute_level = 2
chamber_formation_probability = 0.28
vertical_capture_chamber_probability = 0.62
roof_failure_probability = 0.16

# Retained for the explicit legacy_braid compatibility mode.
[network.braid_grammar]
zone_count = [4, 7]
center_fraction = [0.14, 0.88]
min_center_spacing = 0.10
half_length_fraction = [0.045, 0.095]
branches_per_zone = [2, 4]
lateral_offset_scale = [0.35, 1.25]
start_shift_fraction = [-0.26, 0.26]
end_shift_fraction = [-0.26, 0.26]
skew = [-0.70, 0.70]
wobble = [0.08, 0.38]
underpass_probability = 0.24
ladder_probability = 0.52
ladder_rung_count = [1, 2]
chamber_radius_scale = [1.0, 1.60]

[section_field]
sampling_policy = "adaptive"
base_height_ratio = 0.66
minimum_height_ratio = 0.34
maximum_height_ratio = 0.96
width_scale_median = 0.84
width_scale_log_sigma = 0.60
width_longitudinal_variation = 0.18
height_ratio_variation = 0.18
height_ratio_longitudinal_variation = 0.07
minimum_sample_spacing = 4.0
maximum_sample_spacing = 16.0
curvature_spacing_weight = 120.0
width_gradient_spacing_weight = 34.0
junction_spacing_weight = 1.15
profile_resolution = 40
floor_flatness_base = 0.36
floor_flatness_width_weight = 0.12
floor_relief_base = 0.13
floor_relief_variation = 0.035
roof_arch_base = 1.08
roof_arch_roof_weight = 0.18
wall_roughness_base = 0.14
wall_roughness_variation = 0.045
morphology_gradient_strength = 0.32
morphology_correlation_length = 140.0
morphology_regime_strength = 0.72
morphology_family_spread = 0.82
morphology_flux_width_gain = 0.16
morphology_age_width_gain = 0.10
morphology_floor_relief_max = 0.42
morphology_wall_roughness_max = 0.30
profile_shape_variation = 0.92
lateral_skew_amplitude = 0.16
centerline_wobble_amplitude = 2.8
centerline_wobble_wavelength = 105.0
junction_pre_widen_gain = 0.10
junction_constant_envelope_gain = 0.03
chamber_widen_gain = 0.45
minimum_roof_thickness = 6.5
maximum_centerline_depth = 26.0
preferred_cover_fraction = 0.34
maximum_uphill_grade = 0.015
level_transition_fraction = 0.18

[floor_map]
# The topology-aware atlas is also used as the candidate surface for props.
lateral_spacing_m = 2.5
maximum_lateral_fraction = 0.72
plan_resolution_m = 2.0
minimum_clearance_m = 1.0

[events]
enabled = true
include_rock_props = true
enabled_kinds = ["rock", "boulder", "collapse", "choke", "infill"]
# Multiplies background rocks, boulder anchors, rubble patches, and talus.
rock_population_multiplier = 10.0
use_rocky_meshes = true
strict_optional_provider = true
rocky_source_path = ""
rocky_texture_dir = "../texture/dark_rock_8k/textures"
rocky_output_dir = "../outputs/rocky_stage_e"
rocky_resolution_scale = 1.0
rocky_max_subdivisions = 5
ground_embed_fraction = 0.08
clustered_debris_fraction = 0.45
collapse_cluster_radius_scale = 4.0
collapse_cluster_spacing_scale = 0.90
# Floor-area density keeps wide galleries from looking emptier than narrow ones.
debris_density_basis = "floor_area"
rock_density_per_100m2 = 0.45
boulder_density_per_100m2 = 0.04
# Retained for reproducible legacy length-based projects.
rock_density_per_100m = 2.00
boulder_density_per_100m = 0.18
geological_event_density_per_100m = 0.12
collapse_event_fraction = 0.35
choke_event_fraction = 0.30
infill_event_fraction = 0.35
minimum_event_spacing = 22.0
minimum_rock_spacing = 0.10
minimum_boulder_spacing = 0.35
# Radii: abundant cobbles/small rocks plus rarer rover-scale boulders.
rock_radius_range = [0.03, 0.75]
boulder_radius_range = [0.30, 4.0]
rock_size_bias = 2.8
boulder_size_bias = 2.4
collapse_radius_range = [4.0, 9.0]
choke_radius_range = [3.0, 7.0]
infill_radius_range = [5.0, 12.0]
max_lateral_floor_fraction = 0.62
gallery_width_size_fraction = 0.30
gallery_clearance_size_fraction = 0.45
# A boulder may rise through at most two-thirds of local vertical clearance.
boulder_max_height_fraction = 0.6666666667
roof_block_size_fraction = 0.35
edge_accumulation_strength = 0.70
placement_jitter_m = 0.75
background_contact_spacing = 1.15
# Preserve a continuous route for a rover up to one metre wide.
rover_width_m = 1.0
rover_side_margin_m = 0.10
rover_max_lateral_slope = 0.50
preserve_rover_route = true
# Layered debris populations: patchy floor scatter, wall scree, transported
# lag deposits, compact boulder halos, and larger collapse talus fans.
enable_debris_families = true
clean_floor_fraction = 0.45
debris_patch_length_m = 30.0
wall_scree_fraction = 0.35
transported_lag_fraction = 0.15
boulder_satellite_count_range = [25, 55]
boulder_halo_radius_range_m = [1.2, 4.5]
collapse_fragment_count_range = [50, 120]
collapse_talus_radius_range_m = [5.0, 15.0]
# Smaller parent-and-child rubble patches replace most uniform floor scatter.
minor_cluster_density_per_1000m2 = 0.80
minor_cluster_count_range = [8, 18]
minor_cluster_radius_range_m = [1.2, 3.0]
mesh_latitude_segments = 8
mesh_longitude_segments = 14

[geometry]
# Resolve voxel size from the body and run quality. Preview currently yields
# Earth/Mars/Moon voxel sizes of 1/2/4 m; use resolution_policy="fixed"
# together with voxel_size for an explicit override.
resolution_policy = "body"
storage_mode = "auto"
# Switch to sparse overlapping tiles before the dense field exceeds this size.
max_dense_voxels = 80000000
density_margin = 24.0
chunk_size = 64
iso_level = 0.0
use_section_profiles = true
wall_roughness_amplitude = 0.28
wall_roughness_frequency = 0.18
wall_roughness_blend = 0.85
junction_irregularity_amplitude = 0.30
junction_irregularity_frequency = 0.095
structural_event_blend = 0.35
weld_tolerance = 1e-5
cave_normal_scale = 2.0
cave_smoothing_iterations = 4
cave_displacement_scale_m = 0.12
cave_displacement_midlevel = 0.5
cave_diffuse_texture = "../texture/dark_rock_8k/textures/dark_rock_diff_8k.jpg"
cave_normal_texture = "../texture/dark_rock_8k/textures/dark_rock_nor_gl_8k.exr"
cave_roughness_texture = "../texture/dark_rock_8k/textures/dark_rock_rough_8k.exr"
cave_displacement_texture = "../texture/dark_rock_8k/textures/dark_rock_disp_8k.png"
