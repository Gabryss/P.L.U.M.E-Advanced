schema_version = 4
procedural_seed = 3

[run]
dev_mode = true
quality = "preview"
dev_max_route_length_m = 1200.0
dev_max_lobe_paths = 5
render_diagnostics = false
overwrite_outputs = false

[export]
target = "neutral"
format = "glb"
generate_collision = true

[host_field]
apply_body_scaling = false

[host_field.routing_weights]
slope = 0.12
cover = 0.10
fracture = 0.22
capacity = 0.28
stability = 0.28
normalize = true
enabled = true

[section_field]
sampling_policy = "adaptive"

[host_field.grid]
width = 600.0
height = 1800.0
nx = 80
ny = 180

[network]
target_route_length_m = 250.0
source_count = 3
source_band_length = 60.0
source_band_half_width = 120.0
trace_max_steps = 180

[network.topology]
style = "trunk_dominated"
generation_mode = "layout"
island_count = [1, 1]
side_branch_count = [1, 1]

# Several arterial systems can grow together; count 1 preserves the existing grammar.
[network.systems]
count = 1

[network.quality]
# Deterministic morphology screening before meshing. Exhaustion stops the run.
enabled = true
max_attempts = 8
repair_passes = 3

[events]
enabled = false
include_rock_props = false
use_rocky_meshes = false
rock_population_multiplier = 10.0
rock_density_per_100m2 = 0.45
boulder_density_per_100m2 = 0.04
rock_radius_range = [0.03, 0.75]
boulder_radius_range = [0.30, 4.0]
rock_size_bias = 2.8
boulder_size_bias = 2.4
gallery_width_size_fraction = 0.30
gallery_clearance_size_fraction = 0.45
boulder_max_height_fraction = 0.6666666667
roof_block_size_fraction = 0.35
rover_width_m = 1.0
rover_side_margin_m = 0.10
preserve_rover_route = true
enable_debris_families = true
clean_floor_fraction = 0.45
debris_patch_length_m = 30.0
wall_scree_fraction = 0.35
transported_lag_fraction = 0.15
boulder_satellite_count_range = [25, 55]
boulder_halo_radius_range_m = [1.2, 4.5]
collapse_fragment_count_range = [50, 120]
collapse_talus_radius_range_m = [5.0, 15.0]
minor_cluster_density_per_1000m2 = 0.80
minor_cluster_count_range = [8, 18]
minor_cluster_radius_range_m = [1.2, 3.0]

[geometry]
# Required inspection route: upright 0.5 m capsule, plus 2 cm clearance.
# Optional side passages retain their geological dimensions.
required_route_height_m = 0.5
required_route_width_m = 0.5
route_clearance_margin_m = 0.02
route_inspection_spacing_m = 0.25
route_repair_attempts = 2
route_placement_repair_attempts = 3
route_placement_max_sweeps = 20000
# Refinement is explicit because it can multiply grid and mesh memory.
resolution_refinement_attempts = 0
resolution_min_voxel_size_m = 0.03
resolution_convergence_m = 0.03
resolution_max_allocated_voxels = 160000000
collision_target_reduction = 0.8
collision_max_error_m = 0.03
collision_repair_attempts = 4
surface_local_repair_attempts = 2
# After ordinary surface repair: two local attempts, then at most two new
# network seeds in the same host. Set both to zero to diagnose the initial network.
recovery_local_attempts = 2
recovery_network_attempts = 2
resolution_policy = "fixed"
# A two-metre lattice could erase an entire Earth passage or its rock island.
voxel_size = 0.2
storage_mode = "auto"
max_dense_voxels = 12000000
chunk_size = 48
strict_texture_loading = true
texture_repair_attempts = 1  # 0: inspect only; 1: bounded map repair + one package rebuild
cave_normal_convention = "opengl"  # "directx" explicitly flips Y during texture repair
cave_normal_scale = 1.0
cave_smoothing_iterations = 2
cave_displacement_scale_m = 0.0
cave_displacement_midlevel = 0.5
cave_diffuse_texture = ""
cave_normal_texture = ""
cave_roughness_texture = ""
cave_displacement_texture = ""

[acceptance]
profile = "inspection"
