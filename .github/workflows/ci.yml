name: CI

on:
  push:
  pull_request:

jobs:
  base-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --no-dev
      - run: >-
          uv run --no-sync python -c
          "from importlib.metadata import distributions;
          from plume_advanced import cli;
          c = cli.load_project_config(cli.PACKAGED_CONFIG);
          assert not c.events.include_rock_props and not c.events.use_rocky_meshes;
          assert all(str(d.metadata['Name']).lower() != 'rocky' for d in distributions())"

  test:
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: uv sync --locked --group dev --extra rocks --extra paper
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src/plume_advanced
      - run: uv run --no-sync python -m compileall -q src scripts tests
      - run: uv run --no-sync pytest -q --cov=plume_advanced --cov-report=term-missing --cov-fail-under=70
      - run: uv build
      - name: Check installed wheel resources
        run: |
          uv pip install --python .venv/bin/python --no-deps --reinstall dist/*.whl
          .venv/bin/python -I - <<'PY'
          from importlib.resources import files
          from pathlib import Path
          from plume_advanced import cli
          from plume_advanced.exporters.projected_materials import ASSET_FILES

          assert not Path(cli.__file__).resolve().is_relative_to(Path.cwd() / "src")
          package = files("plume_advanced")
          config = cli.load_project_config(package.joinpath("default_project.toml"))
          assert config.geometry.required_route_height_m == 0.5
          assert config.geometry.required_route_width_m == 0.5
          assert config.acceptance.profile == "inspection"
          assert config.export.generate_collision
          assert config.export.max_visual_triangles > 0 and config.export.max_asset_bytes > 0
          assert all(package.joinpath("material_assets", name).read_bytes() for name in ASSET_FILES)
          PY
