name: CI

on:
  push:
  pull_request:

jobs:
  base-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: >-
          uv run python -c
          "from importlib.metadata import distributions;
          from plume_advanced import cli;
          c = cli.load_project_config(cli.PACKAGED_CONFIG);
          assert not c.events.include_rock_props and not c.events.use_rocky_meshes;
          assert all(str(d.metadata['Name']).lower() != 'rocky' for d in distributions())"

  test:
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: uv sync --locked --group dev --extra rocks
      - run: uv run ruff check src scripts tests
      - run: uv run mypy src/plume_advanced
      - run: uv run python -m compileall -q src scripts tests
      - run: uv run pytest -q --cov=plume_advanced --cov-report=term-missing --cov-fail-under=70
      - run: uv build
